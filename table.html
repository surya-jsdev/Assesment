<!DOCTYPE html>
<html>

<head>
    <title>Form Table</title>
    <style>
        table {
            width: 350px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 4px;
        }

        .submit-btn {
            background-color: green;
            color: white;
            padding: 6px 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td>Input</td>
            <td><input type="text" /></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" /></td>
        </tr>
        <tr>
            <td>Skill</td>
            <td><input type="text" /></td>
        </tr>
        <tr>
            <td>Degree</td>
            <td><input type="text" /></td>
        </tr>
        <tr>
           
            <td colspan="2"><button class="submit-btn" type="submit">Submit</button></td>
        </tr>
    </table>

</body>

</html>
